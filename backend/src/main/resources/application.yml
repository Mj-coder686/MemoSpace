server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: memo-space
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/memospace;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: never
      encoding: UTF-8
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:memospace_redis_2026}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  cache-enabled: ${REDIS_CACHE_ENABLED:false}
  memory:
    trash-retention-days: ${MEMORY_TRASH_RETENTION_DAYS:30}
    trash-purge-cron: ${MEMORY_TRASH_PURGE_CRON:0 20 3 * * *}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  admin:
    enabled: ${ADMIN_ENABLED:true}
    accounts: ${ADMIN_ACCOUNTS:}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:MemoAdmin2026!}
    nickname: ${ADMIN_NICKNAME:拾光管理员}
  jwt:
    secret: ${JWT_SECRET:MemoSpace_Local_Development_Secret_Change_Me_2026_At_Least_32_Bytes}
    expiration-hours: ${JWT_EXPIRATION_HOURS:168}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://localhost,capacitor://localhost}
  push:
    enabled: ${PUSH_ENABLED:false}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    project-id: ${FIREBASE_PROJECT_ID:}
  storage:
    mode: ${STORAGE_MODE:local}
    local-path: ${LOCAL_STORAGE_PATH:./data/uploads}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:memospace_minio}
    secret-key: ${MINIO_SECRET_KEY:memospace_minio_2026}
    bucket: ${MINIO_BUCKET:memospace-private}
    user-quota-bytes: ${STORAGE_USER_QUOTA_BYTES:5368709120}
    thumbnail-max-pixels: ${STORAGE_THUMBNAIL_MAX_PIXELS:921600}
    orphan-retention-hours: ${STORAGE_ORPHAN_RETENTION_HOURS:24}
    orphan-cleanup-cron: ${STORAGE_ORPHAN_CLEANUP_CRON:0 45 3 * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.memospace: INFO
